# Builds STRATUM.exe on a Windows machine. The download zip is STRATUM.exe plus the web app (see package-windows.sh).
name: Windows build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build STRATUM.exe
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VS=%%i
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat"
          windows\build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: STRATUM-exe
          path: windows/out/STRATUM.exe
      # Smoke test on the Windows machine: STRATUM must start, load the web app (the window title becomes
      # "STRATUM — <song>") and still be running after 20 seconds. A screenshot is kept with the build.
      - name: Smoke test
        shell: pwsh
        run: |
          New-Item -ItemType Directory smoke | Out-Null
          Copy-Item windows/out/STRATUM.exe smoke/
          Copy-Item -Recurse web smoke/app
          $p = Start-Process smoke/STRATUM.exe -PassThru
          Start-Sleep 20
          if ($p.HasExited) { throw "STRATUM exited with code $($p.ExitCode)" }
          $p.Refresh()
          $title = $p.MainWindowTitle
          Write-Host "Window title: $title"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD/smoke.png")
          Stop-Process $p
          if (-not $title.StartsWith("STRATUM ")) { throw "The web app did not load (title: '$title')" }
      # STRATUM Sync on Windows against a stand-in sign-in server: email code, upload, and a Discord-style round trip.
      - name: Sync test
        shell: pwsh
        run: |
          $srv = Start-Process python -ArgumentList "tests/mock-sync-server.py", "8799" -PassThru
          Start-Sleep 2
          $p = Start-Process smoke/STRATUM.exe -ArgumentList "--sync-test", "http://127.0.0.1:8799", "$PWD/tests/windows-sync-test.js" -PassThru
          $title = ""
          for ($i = 0; $i -lt 40 -and -not $title.StartsWith("SYNCTEST {`"email"); $i++) { Start-Sleep 1; $p.Refresh(); $title = $p.MainWindowTitle }
          Write-Host "Sync test: $title"
          Stop-Process $p; Stop-Process $srv
          if (-not ($title -match '"user":"discord-user@example.com"' -and $title -match '"beat":"Win unsaved"' -and $title -match 'Windows Beat')) { throw "Sync test failed: $title" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshot
          path: smoke.png
