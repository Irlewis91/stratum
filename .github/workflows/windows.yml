# Builds STRATUM.exe on a Windows machine. The download zip is STRATUM.exe plus the web app (see package-windows.sh).
name: Windows build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vendor code (VST3 SDK, Airwindows)
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ hashFiles('fetch-code.sh') }}
      - name: Compiled Airwindows (vendor code only, so it can be kept between builds)
        uses: actions/cache@v4
        with:
          path: windows/out/obj/airwin
          key: airwin-obj-${{ hashFiles('fetch-code.sh', 'windows/build.py') }}
      - name: Fetch vendor code
        shell: bash
        run: ./fetch-code.sh
      - name: Build STRATUM.exe and the test plugins
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VS=%%i
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat"
          python windows\build.py || exit /b 1
          python windows\build.py plugins || exit /b 1
      - uses: actions/upload-artifact@v4
        with:
          name: STRATUM-exe
          path: windows/out/STRATUM.exe
      # Smoke test on the Windows machine: STRATUM must start, load the web app (the window title becomes
      # "STRATUM — <song>") and still be running after 20 seconds. A screenshot is kept with the build.
      - name: Smoke test
        shell: pwsh
        run: |
          New-Item -ItemType Directory smoke | Out-Null
          Copy-Item windows/out/STRATUM.exe smoke/
          Copy-Item -Recurse web smoke/app
          $p = Start-Process smoke/STRATUM.exe -PassThru
          Start-Sleep 20
          if ($p.HasExited) { throw "STRATUM exited with code $($p.ExitCode)" }
          $p.Refresh()
          $title = $p.MainWindowTitle
          Write-Host "Window title: $title"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD/smoke.png")
          Stop-Process $p
          if (-not $title.StartsWith("STRATUM ")) { throw "The web app did not load (title: '$title')" }
      # STRATUM Sync on Windows against a stand-in sign-in server: email code, upload, and a Discord-style round trip.
      - name: Sync test
        shell: pwsh
        run: |
          $srv = Start-Process python -ArgumentList "tests/mock-sync-server.py", "8799" -PassThru
          Start-Sleep 2
          $p = Start-Process smoke/STRATUM.exe -ArgumentList "--sync-test", "http://127.0.0.1:8799", "$PWD/tests/windows-sync-test.js" -PassThru
          $title = ""
          for ($i = 0; $i -lt 40 -and -not $title.StartsWith("SYNCTEST {`"email"); $i++) { Start-Sleep 1; $p.Refresh(); $title = $p.MainWindowTitle }
          Write-Host "Sync test: $title"
          Stop-Process $p; Stop-Process $srv
          if (-not ($title -match '"user":"discord-user@example.com"' -and $title -match '"beat":"Win unsaved"' -and $title -match 'Windows Beat')) { throw "Sync test failed: $title" }
      # The native engine on Windows: plugin list, STRATUM Wave, VST3 and VST2 instruments and effects, Airwindows, Tune,
      # plugin controls and saved settings, and live playback (on the machine's sound device or the silent stand-in).
      - name: Engine test
        shell: pwsh
        run: |
          $env:STRATUM_VST3_PATH = "$PWD\windows\out\test-plugins"
          $env:STRATUM_TEST_OUT = "$PWD\engine-test.json"
          $p = Start-Process smoke/STRATUM.exe -ArgumentList "--test-script", "$PWD/tests/windows-engine-test.js" -PassThru
          for ($i = 0; $i -lt 180 -and -not (Test-Path engine-test.json); $i++) { Start-Sleep 1 }
          Stop-Process $p -ErrorAction SilentlyContinue
          if (-not (Test-Path engine-test.json)) { throw "The engine test did not finish" }
          $r = Get-Content engine-test.json -Raw
          Write-Host $r
          $j = $r | ConvertFrom-Json
          if ($j.error) { throw "Engine test error: $($j.error)" }
          $checks = @{
            "Airwindows effects listed" = ($j.catalogue.airwindows -gt 400)
            "STRATUM Wave plays" = ($j.wave.held -gt 0.01)
            "VST3 instrument plays" = ($j.vst3inst.held -gt 0.005)
            "VST3 effect passes sound" = ($j.vst3fx.held -gt 0.005)
            "VST2 instrument plays A440" = ([math]::Abs($j.vst2inst.hz - 440) -lt 15)
            "VST2 effect control works" = ($j.vst2fxAtFull -gt $j.vst2fx.held * 1.5)
            "Airwindows effect passes sound" = ($j.airwindows.held -gt 0.005)
            "Tune passes sound" = ($j.tune.held -gt 0.005)
            "Live playback" = ($j.live.livePeakSoFar -gt 0.001)
          }
          $failed = $checks.GetEnumerator() | Where-Object { -not $_.Value } | ForEach-Object { $_.Key }
          $checks.GetEnumerator() | ForEach-Object { Write-Host ("{0,-34} {1}" -f $_.Key, $(if ($_.Value) { "ok" } else { "FAILED" })) }
          if ($failed) { throw "Engine checks failed: $($failed -join ', ')" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshot
          path: smoke.png
