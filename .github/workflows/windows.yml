# Builds STRATUM.exe on a Windows machine. The download zip is STRATUM.exe plus the web app (see package-windows.sh).
name: Windows build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build STRATUM.exe
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VS=%%i
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat"
          windows\build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: STRATUM-exe
          path: windows/out/STRATUM.exe
      # Smoke test on the Windows machine: STRATUM must start, load the web app (the window title becomes
      # "STRATUM — <song>") and still be running after 20 seconds. A screenshot is kept with the build.
      - name: Smoke test
        shell: pwsh
        run: |
          New-Item -ItemType Directory smoke | Out-Null
          Copy-Item windows/out/STRATUM.exe smoke/
          Copy-Item -Recurse web smoke/app
          $p = Start-Process smoke/STRATUM.exe -PassThru
          Start-Sleep 20
          if ($p.HasExited) { throw "STRATUM exited with code $($p.ExitCode)" }
          $p.Refresh()
          Write-Host "Window title: $($p.MainWindowTitle)"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD/smoke.png")
          Stop-Process $p
          if (-not $p.MainWindowTitle.StartsWith("STRATUM ")) { throw "The web app did not load (title: '$($p.MainWindowTitle)')" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshot
          path: smoke.png
